name: test

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npx --yes skills@1.5.20 add . --list
      - run: npx --yes skills@1.5.20 use . --skill mullet
